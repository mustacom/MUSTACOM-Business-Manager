name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean build\mustacom.spec

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\mustacom\MUSTACOM-Business-Manager.exe"

          if (-not (Test-Path $exe)) {
            throw "Executable was not created: $exe"
          }

          Write-Host "Executable created successfully:"
          Write-Host $exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "1.0.0"

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          }

          Write-Host "Building installer version $version"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "installer\mustacom.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MUSTACOM-Business-Manager-Setup
          path: installer\Output\MUSTACOM-Business-Manager-Setup.exe
          if-no-files-found: error

      - name: Upload frozen application
        uses: actions/upload-artifact@v4
        with:
          name: MUSTACOM-Business-Manager-Windows-Bundle
          path: dist\mustacom\
          if-no-files-found: error
